<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar | vue principale sur fond d'ambiance (pochette floutée) ; lecteur en bas ; écran « En lecture » plein écran. Mobile : mini-lecteur + onglets. */
:root{
  --bg:#0b0d12; --panel:#12151d; --raise:#1a1e2a; --raise2:#232838; --line:#262b3b;
  --fg:#f1f2f7; --muted:#8a90a6; --faint:#5d6378; --accent:#ffb02e; --accent-ink:#1d1305; --like:#ff5d73;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  --player-h:92px; --tabs-h:0px; color-scheme:dark;
  --t1:#ff7a59; --t2:#3fa7ff; --t3:#b06bff; --t4:#2ed39a; --t5:#ff4f9a; --t6:#ffc94a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input{font:inherit;color:var(--fg)}
[hidden]{display:none!important}
svg{display:block;flex:none}
img{max-width:100%}

/* --- Ambiance --- */
.backdrop{position:fixed;inset:0 0 auto 232px;height:460px;pointer-events:none;z-index:0;overflow:hidden;opacity:0;transition:opacity .8s}
.backdrop.on{opacity:1}
.backdrop img{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(70px) saturate(1.5);opacity:.42}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,var(--bg) 100%)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;height:calc(100% - var(--player-h) - var(--tabs-h) - env(safe-area-inset-bottom,0px))}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:24px;min-height:0;overflow:auto}
.brand{font:800 22px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:10px;padding:0 10px}
.logo{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),#ff7a59,var(--accent));display:grid;place-items:center}
.logo::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--panel)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left;transition:color .15s,background .15s}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg);background:var(--raise)}
.nav button.on svg{color:var(--accent)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;padding:0 12px 8px;display:flex;justify-content:space-between;align-items:center}
.label button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.label button:hover{color:var(--fg);background:var(--raise)}
.pls{display:flex;flex-direction:column;gap:2px}
.pls button{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;text-align:left;color:var(--muted);min-width:0}
.pls button:hover,.pls button.on{color:var(--fg);background:var(--raise)}
.pls .mini{width:36px;height:36px;border-radius:6px;background:var(--raise2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--faint)}
.pls .mini img{width:100%;height:100%;object-fit:cover}
.pls .nm{min-width:0}
.pls .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.pls .nm small{color:var(--muted);font-size:12px}
.side .credit{margin-top:auto;font-size:11px;color:var(--faint);padding:0 12px;line-height:1.5}
.side .credit a{color:var(--muted)}

main{overflow:auto;min-width:0;padding-block:30px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));scroll-behavior:smooth}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.view > *{min-width:0}

h1.greet{font:800 clamp(30px,4.5vw,46px)/1 var(--display);letter-spacing:-.035em;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font:700 22px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.sec-h span{color:var(--muted);font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-4px;padding:4px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--fg);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s}
.chip:hover{background:rgba(255,255,255,.13)}
.chip.on{background:var(--fg);color:var(--bg)}

/* --- Hero --- */
.hero{position:relative;border-radius:22px;overflow:hidden;display:flex;gap:28px;align-items:flex-end;padding:28px;min-height:250px;background:var(--raise)}
.hero .hbg{position:absolute;inset:0}
.hero .hbg img{width:100%;height:100%;object-fit:cover;filter:blur(40px) saturate(1.6) brightness(.55);transform:scale(1.3)}
.hero .hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,13,18,.75),rgba(11,13,18,.15))}
.hero > *:not(.hbg){position:relative}
.hero .hart{width:190px;height:190px;border-radius:14px;overflow:hidden;flex:none;box-shadow:0 18px 40px rgba(0,0,0,.45);background:var(--raise2)}
.hero .hart img{width:100%;height:100%;object-fit:cover}
.hero .htext{min-width:0;display:flex;flex-direction:column;gap:8px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--accent)}
.hero h2{font:800 clamp(28px,4.2vw,52px)/.98 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .by{color:rgba(241,242,247,.8);font-weight:500}
.hero .by b{color:var(--fg)}
.hero .acts{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font-weight:700;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{transform:scale(1.03)}
.btn.soft{background:rgba(255,255,255,.12);color:var(--fg)}
.btn.soft:hover{background:rgba(255,255,255,.2)}
.btn.danger:hover{background:rgba(255,93,115,.2);color:var(--like)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:background .15s}
.round:hover{background:rgba(255,255,255,.2)}
.round.liked{color:var(--like)}

/* --- Shelf of cards --- */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,17%,190px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{scroll-snap-align:start;padding:10px;border-radius:14px;background:transparent;transition:background .2s;cursor:pointer;min-width:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.card:hover{background:var(--panel)}
.card .cart{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--raise);max-width:100%;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.card .cart img{width:100%;height:100%;object-fit:cover}
.card .rank{position:absolute;left:8px;top:6px;font:800 30px/1 var(--display);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);letter-spacing:-.04em}
.card .fab{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.card:hover .fab,.card.cur .fab{opacity:1;transform:none}
.card b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card.cur b{color:var(--accent)}

/* --- Browse tiles --- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{position:relative;height:104px;border-radius:14px;padding:14px;text-align:left;font:800 20px/1.05 var(--display);letter-spacing:-.02em;overflow:hidden;color:#fff;background:var(--c)}
.tile::after{content:"";position:absolute;right:-18px;bottom:-22px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 14px rgba(0,0,0,.12)}
.tile:hover{filter:brightness(1.1)}

/* --- Page header (playlist etc.) --- */
.phead{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.phead .pcover{width:180px;height:180px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);background:var(--raise2);color:var(--accent)}
.phead .pcover img{width:100%;height:100%;object-fit:cover}
.phead .pcover.likes{background:linear-gradient(135deg,#ff5d73,#7a3cff);color:#fff}
.phead .pcover.files{background:linear-gradient(135deg,#ffb02e,#ff7a59);color:var(--accent-ink)}
.phead .ptext{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.phead h1{font:800 clamp(32px,5.5vw,64px)/.95 var(--display);letter-spacing:-.04em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.phead p{margin:0;color:var(--muted)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,176,46,.25);transition:transform .15s}
.bigplay:hover{transform:scale(1.06)}

.searchbox{display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);border-radius:999px;padding:0 20px;max-width:560px}
.searchbox input{flex:1;min-width:0;background:none;border:0;padding:15px 0;outline:none;font-size:16px;color:var(--bg);font-weight:500}
.searchbox input::placeholder{color:#6b7185}

.drop{border:1.5px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:rgba(255,176,46,.06);color:var(--fg)}
.drop strong{color:var(--fg);font-size:15px}
.drop label{color:var(--accent);cursor:pointer;font-weight:600}

/* --- Track list --- */
.list{display:flex;flex-direction:column}
.lhead,.row{display:grid;grid-template-columns:36px minmax(0,1fr) 110px 56px 72px;align-items:center;gap:14px;padding:6px 12px}
.lhead{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.lhead :nth-child(3),.lhead :nth-child(4){text-align:right}
.row{border-radius:10px;transition:background .12s}
.row:hover{background:rgba(255,255,255,.05)}
.row.cur{background:rgba(255,176,46,.07)}
.row .n{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;position:relative;height:20px;display:grid;place-items:center}
.row .n .hov{display:none}
.row:hover .n .num{display:none}
.row:hover .n .hov{display:grid}
.row .main{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.row .art{width:46px;height:46px;border-radius:7px;background:var(--raise);overflow:hidden;flex:none}
.row .art img{width:100%;height:100%;object-fit:cover}
.row .meta{min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:var(--accent)}
.row .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .plays,.row .d{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row .btns{display:flex;gap:2px;justify-content:flex-end}
.ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .15s,background .15s}
.ib:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.ib.liked{color:var(--like)}
.row .btns .ib:not(.liked){opacity:0}
.row:hover .btns .ib,.row:focus-within .btns .ib{opacity:1}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq span{width:3px;border-radius:1px;background:var(--accent);animation:eq .9s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:-.3s}.eq span:nth-child(3){animation-delay:-.6s}
body:not(.is-playing) .eq span{animation-play-state:paused;height:6px}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

.empty{color:var(--muted);padding:34px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.skel{height:58px;border-radius:10px;background:linear-gradient(90deg,var(--panel),var(--raise),var(--panel));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:4px}
.skel.hero-s{height:250px;border-radius:22px}
@keyframes sk{to{background-position:-200% 0}}

/* --- Player --- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--player-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(11,13,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:20px}
.now{display:flex;align-items:center;gap:14px;min-width:0}
.now .np-open{display:flex;align-items:center;gap:14px;min-width:0;text-align:left}
.now .art{width:58px;height:58px;border-radius:8px;background:var(--raise);overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.now .art img{width:100%;height:100%;object-fit:cover}
.now .txt{min-width:0}
.now .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.btnrow{display:flex;align-items:center;gap:20px}
.ib.tog{position:relative}
.ib.tog.on{color:var(--accent)}
.ib.tog.on::after{content:"";position:absolute;bottom:-1px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.pp{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .15s}
.pp:hover{transform:scale(1.06)}
.ic-pause{display:none!important}
body.is-playing .ic-play{display:none!important}
body.is-playing .ic-pause{display:block!important}
.seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p,0%),rgba(255,255,255,.18) var(--p,0%));cursor:pointer;min-width:0;margin:0}
input[type=range]:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.right input{max-width:110px;margin-left:4px}
.mini-btns,.mprog{display:none}

/* --- Now playing (plein écran) --- */
.np{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.np .npbg{position:absolute;inset:0}
.np .npbg img{position:absolute;inset:-15%;width:130%;height:130%;object-fit:cover;filter:blur(80px) saturate(1.6) brightness(.5)}
.np .npbg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,13,18,.2),rgba(11,13,18,.85))}
.np .npin{position:relative;flex:1;display:flex;flex-direction:column;gap:22px;width:100%;max-width:460px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:0}
.np header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.np header .ctx{text-align:center;min-width:0;font-size:12px}
.np header .ctx small{display:block;text-transform:uppercase;letter-spacing:.1em;color:rgba(241,242,247,.65);font-size:10px;font-weight:600}
.np header .ctx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .bigart{flex:1;min-height:0;display:grid;place-items:center}
.np .bigart div{width:100%;max-height:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--raise);box-shadow:0 30px 60px rgba(0,0,0,.5);max-width:100%;display:grid;place-items:center;color:var(--faint);transition:transform .4s}
body:not(.is-playing) .np .bigart div{transform:scale(.92)}
.np .bigart img{width:100%;height:100%;object-fit:cover}
.np .info{display:flex;align-items:center;gap:12px}
.np .info > div{min-width:0;flex:1}
.np .info h2{font:800 26px/1.1 var(--display);letter-spacing:-.025em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .info p{margin:4px 0 0;color:rgba(241,242,247,.7);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .seek{font-size:12px;color:rgba(241,242,247,.7)}
.np .seek{flex-wrap:wrap;gap:6px 0}
.np .seek input{flex-basis:100%}
.np .seek span{width:auto}
.np .seek span:last-child{margin-left:auto}
.np input[type=range]::-webkit-slider-thumb{opacity:1}
.np .big{display:flex;align-items:center;justify-content:space-between}
.np .big .ib{width:46px;height:46px}
.np .big .pp{width:70px;height:70px}

/* --- Queue panel --- */
.queue{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--player-h) + var(--tabs-h) + env(safe-area-inset-bottom,0px) + 12px);width:min(380px,calc(100% - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:16px;z-index:9;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.queue .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.queue h3{font:700 17px var(--display);margin:0}
.queue h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:14px 0 6px}
.queue .row{grid-template-columns:minmax(0,1fr) 32px;padding:5px 6px}
.queue .row .btns .ib{opacity:1}

/* --- Modal & toast --- */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:12;padding:16px}
.box{background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
.box h3{font:700 20px var(--display);margin:0 0 4px;letter-spacing:-.02em}
.box .opt{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;text-align:left}
.box .opt:hover{background:var(--raise2)}
.box .opt .mini{width:40px;height:40px;border-radius:6px;background:var(--raise2);overflow:hidden;flex:none}
.box .opt .mini img{width:100%;height:100%;object-fit:cover}
.box .opt small{display:block;color:var(--muted)}
.box .newpl{display:flex;gap:8px}
.box .newpl input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none}
.box .newpl input:focus{border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + var(--tabs-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,8px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:13;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tabs{display:none}

/* --- Artiste --- */
[data-artist]{cursor:pointer}

.ahead .abg{position:absolute;inset:0}
.ahead .abg img{width:100%;height:100%;object-fit:cover;animation:kenburns 24s ease-in-out infinite alternate}
.ahead .abg.blur img{filter:blur(50px) saturate(1.5);animation:none;transform:scale(1.5)}
.btn.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.ahead .abg::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,13,18,.94) 0%,rgba(11,13,18,.4) 55%,rgba(11,13,18,.3) 100%)}
.ahead .back{position:absolute;left:16px;top:16px;z-index:2;background:rgba(11,13,18,.6)}
.ahead .back:hover{background:rgba(11,13,18,.85)}
.ahead .ainfo{position:relative;display:flex;align-items:flex-end;gap:22px;min-width:0;width:100%}
.avatar{overflow:hidden;background:var(--raise2);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:800}
.avatar img{width:100%;height:100%;object-fit:cover}
.ahead .avatar{width:136px;height:136px;border-radius:50%;flex:none;box-shadow:0 14px 34px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.16);font-size:52px}
.ahead .atext{min-width:0;display:flex;flex-direction:column;gap:8px}

.verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.verified svg{color:var(--t2)}
.astats{color:rgba(241,242,247,.82);font-weight:500}
.astats b{color:var(--fg);font-variant-numeric:tabular-nums}
.bio{color:var(--muted);max-width:68ch;white-space:pre-line;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.btn.follow{border:1.5px solid rgba(255,255,255,.35);height:38px;padding:0 18px}
.btn.follow:hover{border-color:var(--fg)}
.btn.follow.on{border-color:var(--accent);color:var(--accent)}
.btn.sm{height:38px;padding:0 18px}
.people{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(120px,14%,150px);gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.person{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px;border-radius:14px;text-align:center;min-width:0;transition:background .2s}
.person:hover{background:var(--panel)}
.person .avatar{width:100%;max-width:100%;aspect-ratio:1;border-radius:50%;font-size:34px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.person:hover .avatar{transform:scale(1.06)}
.person .ptxt{min-width:0;max-width:100%}
.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:760px){

}

/* --- Animations --- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5)}65%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes swap{from{opacity:0;transform:scale(.84)}}
@keyframes slidein{from{opacity:0;transform:translateY(9px)}}
@keyframes drift{from{transform:scale(1.3) translate(-3%,-2%)}to{transform:scale(1.5) translate(3%,2%)}}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14) translate(1.5%,-1.5%)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.1)}60%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 0 rgba(255,176,46,.42)}100%{box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 30px rgba(255,176,46,0)}}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,176,46,.5)}100%{box-shadow:0 0 0 16px rgba(255,176,46,0)}}
@keyframes down{to{transform:translateY(70px);opacity:0}}
@keyframes panel{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes miniup{from{transform:translateY(120%)}}

/* entrée des vues : blocs puis éléments en cascade */
.view.enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter > :nth-child(2){animation-delay:.05s}
.view.enter > :nth-child(3){animation-delay:.1s}
.view.enter > :nth-child(4){animation-delay:.15s}
.view.enter > :nth-child(n+5){animation-delay:.2s}
.view.enter .row,.view.enter .card,.view.enter .tile,.view.enter .person,.view.enter .chip{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.1s + var(--i,0)*24ms)}
.view.enter .ahead .avatar,.view.enter .hero .hart,.view.enter .phead .pcover{animation:swap .6s cubic-bezier(.2,.8,.2,1) both .1s}

/* ambiance */
.hero .hbg img,.backdrop img{animation:drift 22s ease-in-out infinite alternate}
body.is-playing .logo{animation:beat 1.4s ease-in-out infinite}
body.is-playing .np .bigart div{animation:ring 1.9s ease-out infinite}
body.is-playing .player .pp{animation:halo 1.9s ease-out infinite}

/* micro-interactions */
.ib{transition:color .15s,background .15s,transform .12s}
.round{transition:background .15s,transform .12s}
.chip{transition:background .15s,transform .12s}

.tile{transition:transform .2s,filter .2s}
.tile:hover{transform:scale(1.03)}
.tile::after{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile:hover::after{transform:scale(1.3) rotate(25deg)}
.row .art img{transition:transform .4s}
.row:hover .art img{transform:scale(1.1)}
.nav button svg{transition:transform .2s}
.nav button:hover svg{transform:scale(1.14)}
.hero .hart{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero:hover .hart{transform:rotate(-2deg) scale(1.03)}
.pop svg{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.swap{animation:slidein .38s ease both}
.js-art img,.js-bigart img{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
.np.closing{animation:down .26s ease-in forwards}
.queue{animation:panel .26s cubic-bezier(.2,.8,.2,1)}
.modal{animation:fadein .2s}
.box{animation:panel .28s cubic-bezier(.2,.8,.2,1)}
.btn.follow{transition:border-color .2s,color .2s,transform .12s}
@media (max-width:760px){ .player.first{animation:miniup .4s cubic-bezier(.2,.8,.2,1)} }

/* --- Tablette --- */

const API = "https://api.audius.co/v1";

const GENRES = ["Tout","Electronic","Hip-Hop/Rap","Pop","Lo-Fi","House","Alternative","R&B/Soul","Techno","Trap","Ambient","Rock"];
const TILE_COLORS = ["var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--t5)","var(--t6)"];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const audio = $("#audio");

const store = {
  get(k, d){ try { const v = localStorage.getItem("pulse_"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("pulse_"+k, JSON.stringify(v)); } catch(e){} }
};

const S = {
  view: "home", genre: "Tout", plId: null, artistId: null,
  trending: {}, results: [], people: [], query: "",
  artists: {}, hist: [], pop: null,
  following: store.get("following", []),
  local: [],
  likes: store.get("likes", []),
  playlists: store.get("playlists", []),
  queue: [], order: [], pos: -1, ctx: "",
  shuffle: store.get("shuffle", false),
  repeat: store.get("repeat", "off"),
  current: null
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { if(!isFinite(s) || s <= 0) return "0:00"; s = Math.floor(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const fmtPlays = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(".",",")+" M" : n >= 1e3 ? Math.round(n/1e3)+" k" : String(n||0);
const totalTime = list => { const m = Math.round(list.reduce((a,t)=>a+(t.duration||0),0)/60); return m >= 60 ? Math.floor(m/60)+" h "+(m%60)+" min" : m+" min"; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900); }
const greeting = () => { const h = new Date().getHours(); return h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir"; };

function norm(t){
  return {
    key: "a:"+t.id, id: t.id, source: "audius",
    title: t.title, artist: t.user?.name || "Artiste inconnu",
    artistId: t.user?.id || "",
    art: t.artwork?.["480x480"] || t.artwork?.["150x150"] || "",
    artBig: t.artwork?.["1000x1000"] || t.artwork?.["480x480"] || "",
    genre: t.genre || "",
    duration: t.duration || 0, plays: t.play_count || 0,
    src: `${API}/tracks/${t.id}/stream?app_name=${APP}`
  };
}
function normUser(u){
  return {
    id: u.id, name: u.name || u.handle || "Artiste", handle: u.handle || "",
    bio: u.bio || "", location: u.location || "", verified: !!u.is_verified,
    followers: u.follower_count || 0, trackCount: u.track_count || 0,
    pic: u.profile_picture?.["480x480"] || u.profile_picture?.["150x150"] || "",
    cover: u.cover_photo?.["2000x"] || u.cover_photo?.["640x"] || ""
  };
}
async function api(path){
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(`${API}${path}${sep}app_name=${APP}`);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return (await r.json()).data || [];
}

const EQ = `<div class="eq"><span></span><span></span><span></span></div>`;
const isLiked = k => S.likes.some(t => t.key === k);
const isCur = t => S.current && S.current.key === t.key;
const img = (src, lazy=true) => src ? `<img src="${esc(src)}" alt=""${lazy?' loading="lazy"':''}>` : "";
const aLink = t => t.artistId ? `<span data-artist="${esc(t.artistId)}">${esc(t.artist)}</span>` : esc(t.artist);
const initial = name => esc((name || "?").replace(/^[^\p{L}\p{N}]+/u,"").charAt(0).toUpperCase() || "?");
const isFollowing = id => S.following.some(a => a.id === id);
function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 650); }
function enter(){
  const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
  clearTimeout(enter.h); enter.h = setTimeout(() => v.classList.remove("enter"), 1100);
}
function closeNP(){
  const np = $("#np"); if(np.hidden || np.classList.contains("closing")) return;
  np.classList.add("closing"); setTimeout(() => { np.hidden = true; np.classList.remove("closing"); }, 250);
}

/* ---------- building blocks ---------- */
function rowsHTML(list, opts={}){
  if(!list.length) return `<div class="empty">${opts.empty || "Aucun titre."}</div>`;
  const head = `<div class="lhead"><div style="text-align:center">#</div><div>Titre</div><div>Écoutes</div><div>Durée</div><div></div></div>`;
  return `<div class="list">${opts.noHead ? "" : head}` + list.map((t,i) => {
    const cur = isCur(t);
    const like = t.source === "audius" ? `<button class="ib ${isLiked(t.key)?"liked":""}${S.pop===t.key?" pop":""}" data-like="${i}" aria-label="${isLiked(t.key)?"Retirer des likes":"Liker"}">${ICON.heart}</button>` : "";
    const add = t.source === "audius" ? `<button class="ib" data-add="${i}" aria-label="Ajouter à une playlist">${ICON.plus}</button>` : "";
    const rm = opts.removable ? `<button class="ib" data-rm="${i}" aria-label="Retirer">${ICON.x}</button>` : "";
    return `<div class="row ${cur?"cur":""}" style="--i:${Math.min(i,18)}">
      <div class="n">${cur ? EQ : `<span class="num">${i+1}</span><span class="hov">${ICON.playS}</span>`}</div>
      <div class="main" data-play="${i}" tabindex="0" role="button" aria-label="Lire ${esc(t.title)}">
        <div class="art">${img(t.art)}</div>
        <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${aLink(t)}</div></div>
      </div>
      <div class="plays">${t.source==="audius" ? fmtPlays(t.plays) : "Local"}</div>
      <div class="d">${fmt(t.duration)}</div>
      <div class="btns">${add}${like}${rm}</div>
    </div>`;
  }).join("") + `</div>`;
}
function cardsHTML(list, offset, ranked){
  return `<div class="shelf">` + list.map((t,j) => {
    const i = j + offset;
    return `<div class="card ${isCur(t)?"cur":""}" style="--i:${j}" data-play="${i}" tabindex="0" role="button" aria-label="Lire ${esc(t.title)}">
      <div class="cart">${img(t.art)}${ranked?`<span class="rank">${i+1}</span>`:""}<span class="fab">${isCur(t) && !audio.paused ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>' : ICON.play}</span></div>
      <div><b>${esc(t.title)}</b><small>${aLink(t)}</small></div>
    </div>`;
  }).join("") + `</div>`;
}
function pageHead(kicker, title, sub, cover, cls=""){
  return `<div class="phead"><div class="pcover ${cls}">${cover}</div><div class="ptext"><div class="kicker">${kicker}</div><h1>${esc(title)}</h1><p>${sub}</p></div></div>`;
}
function playActions(list, extra=""){
  return `<div class="actions">${list.length?`<button class="bigplay" data-playall aria-label="Tout lire">${ICON.play}</button><button class="round tog ${S.shuffle?"on":""}" data-shuffleall aria-label="Lecture aléatoire" style="${S.shuffle?"color:var(--accent)":""}">${ICON.shuffle}</button>`:""}${extra}</div>`;
}
const countLabel = list => list.length + " titre" + (list.length>1?"s":"") + (list.length ? " · " + totalTime(list) : "");
const skel = n => Array.from({length:n},()=>`<div class="skel"></div>`).join("");

/* ---------- views ---------- */
let visible = [];
function render(){
  $$("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  renderPls();
  const v = $("#view");
  const views = { home: viewHome, search: viewSearch, local: viewLocal, likes: viewLikes, playlist: viewPlaylist, library: viewLibrary, artist: viewArtist };
  v.innerHTML = (views[S.view] || viewHome)();
  if(S.view === "local") bindDrop();
}

function viewHome(){
  const g = S.genre, data = S.trending[g];
  visible = data || [];
  const chips = `<div class="chips">${GENRES.map((x,i)=>`<button class="chip ${x===g?"on":""}" style="--i:${i}" data-genre="${esc(x)}">${x==="Tout"?"Tous les genres":esc(x)}</button>`).join("")}</div>`;
  let body;
  if(data === undefined){ loadTrending(g); body = `<div class="skel hero-s"></div>${skel(6)}`; }
  else if(data === null) body = `<div class="empty">Impossible de joindre Audius. Vérifie ta connexion internet.<button class="btn soft" data-retry>Réessayer</button></div>`;
  else if(!data.length) body = `<div class="empty">Aucune tendance pour ce genre cette semaine.</div>`;
  else {
    const f = data[0];
    body = `<section class="hero">
        <div class="hbg">${img(f.artBig,false)}</div>
        <div class="hart">${img(f.artBig,false)}</div>
        <div class="htext">
          <div class="kicker">N°1 des tendances${g!=="Tout"?" · "+esc(g):""}</div>
          <h2>${esc(f.title)}</h2>
          <div class="by"><b>${aLink(f)}</b> · ${fmtPlays(f.plays)} écoutes · ${fmt(f.duration)}</div>
          <div class="acts">
            <button class="btn primary" data-play="0">${isCur(f) && !audio.paused ? "Pause" : ICON.playS+" Écouter"}</button>
            <button class="round ${isLiked(f.key)?"liked":""}${S.pop===f.key?" pop":""}" data-like="0" aria-label="Liker">${ICON.heart}</button>
            <button class="round" data-add="0" aria-label="Ajouter à une playlist">${ICON.plus}</button>
          </div>
        </div>
      </section>
      <section><div class="sec-h"><h2>Top 10 de la semaine</h2><span>Les plus écoutés</span></div>${cardsHTML(data.slice(1,11),1,true)}</section>
      <section><div class="sec-h"><h2>Tout le classement</h2><span>${data.length} titres</span></div>${playActions(data)}<div style="height:12px"></div>${rowsHTML(data)}</section>`;
  }
  return `<h1 class="greet">${greeting()}</h1>${chips}${body}`;
}

function viewSearch(){
  visible = S.results;
  const browse = `<section><div class="sec-h"><h2>Parcourir par genre</h2></div><div class="tiles">${GENRES.slice(1).map((g,i)=>`<button class="tile" style="--c:${TILE_COLORS[i%TILE_COLORS.length]};--i:${i}" data-browse="${esc(g)}">${esc(g)}</button>`).join("")}</div></section>`;
  return `<h1 class="greet">Rechercher</h1>
    <form class="searchbox" id="sform"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Quel son veux-tu écouter ?" value="${esc(S.query)}" autocomplete="off" enterkeyhint="search"></form>
    <div id="sres">${searchBody()}</div>
    ${S.query ? "" : browse}`;
}
function searchBody(){
  if(!S.query) return "";
  if(S.searching) return skel(6);
  if(!S.results.length && !S.people.length) return `<div class="empty">Aucun résultat pour « ${esc(S.query)} ». Essaie un autre mot.</div>`;
  const top = S.results[0];
  const people = S.people.length ? `<section><div class="sec-h"><h2>Artistes</h2></div><div class="people">${S.people.map((u,i)=>personHTML(u,i)).join("")}</div></section>` : "";
  const best = top ? `<section><div class="sec-h"><h2>Meilleur résultat</h2></div>
      <div class="hero" style="min-height:0;padding:20px"><div class="hbg">${img(top.artBig,false)}</div><div class="hart" style="width:110px;height:110px">${img(top.art,false)}</div>
      <div class="htext"><h2 style="font-size:clamp(24px,3vw,34px)">${esc(top.title)}</h2><div class="by"><b>${aLink(top)}</b> · ${fmtPlays(top.plays)} écoutes</div>
      <div class="acts"><button class="btn primary" data-play="0">${ICON.playS} Écouter</button></div></div></div></section>` : "";
  const tracks = top ? `<section><div class="sec-h"><h2>Titres</h2><span>${S.results.length} résultats</span></div>${rowsHTML(S.results)}</section>` : "";
  return `<div style="display:flex;flex-direction:column;gap:30px">${best}${people}${tracks}</div>`;
}
const personHTML = (u,i) => `<button class="person" style="--i:${i}" data-artist="${esc(u.id)}"><span class="avatar">${u.pic ? img(u.pic) : initial(u.name)}</span><span class="ptxt"><b>${esc(u.name)}</b><small>${fmtPlays(u.followers)} abonnés</small></span></button>`;

function viewArtist(){
  const id = S.artistId, a = S.artists[id];
  visible = [];
  if(a === undefined){ loadArtist(id); return `<div class="skel hero-s" style="height:310px"></div><div>${skel(6)}</div>`; }
  if(a === null) return `<div class="empty">Impossible de charger cet artiste. Vérifie ta connexion internet.<div class="actions"><button class="btn soft" data-retryartist>Réessayer</button><button class="btn soft" data-act="back">Retour</button></div></div>`;
  const u = a.user, fol = isFollowing(id);

  const badge = u.verified
    ? `<span class="verified"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.6 2.2 3.4-.3.9 3.3 2.9 1.8-1.3 3.1 1.3 3.2-2.9 1.8-.9 3.3-3.4-.3L12 22.5l-2.6-2.2-3.4.3-.9-3.3-2.9-1.8 1.3-3.2-1.3-3.1 2.9-1.8.9-3.3 3.4.3z"/><path d="M8 12.2l2.8 2.8L16.2 9.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Artiste vérifié</span>`
    : `<div class="kicker">Artiste</div>`;

    + (u.handle ? `<a class="btn soft sm" style="margin-left:auto" href="https://audius.co/${encodeURIComponent(u.handle)}" target="_blank" rel="noopener">Voir sur Audius</a>` : "");
  return `<section class="ahead">${banner}
      <button class="round back" data-act="back" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="ainfo">
        <div class="avatar">${u.pic ? img(u.pic,false) : initial(u.name)}</div>
        <div class="atext">${badge}<h1>${esc(u.name)}</h1>
          <div class="astats"><b>${fmtPlays(u.followers)}</b> abonnés · <b>${u.trackCount}</b> titre${u.trackCount>1?"s":""}${u.location ? " · "+esc(u.location) : ""}</div>
        </div>
      </div>
    </section>
    ${playActions(a.tracks, extra)}
    ${u.bio ? `<p class="bio">${esc(u.bio)}</p>` : ""}
    <section><div class="sec-h"><h2>Titres populaires</h2><span>${countLabel(a.tracks)}</span></div>${rowsHTML(a.tracks,{empty:"Cet artiste n'a pas encore publié de titre."})}</section>`;

function renderPls(){
  const entry = (attrs, on, cover, name, sub, style="", cls="") => `<button ${attrs} class="${on?"on":""}"><span class="mini ${cls}" style="${style}">${cover}</span><span class="nm"><b>${name}</b><small>${sub}</small></span></button>`;
  $("#pls").innerHTML =
    entry('data-go="likes"', S.view==="likes", ICON.heart, "Titres likés", S.likes.length+" titres", "background:linear-gradient(135deg,#ff5d73,#7a3cff);color:#fff")
    + S.playlists.map(p => entry(`data-openpl="${p.id}"`, S.view==="playlist"&&S.plId===p.id, p.tracks[0]?.art ? img(p.tracks[0].art) : ICON.note, esc(p.name), "Playlist · "+p.tracks.length)).join("")
    + S.following.map(a => entry(`data-artist="${esc(a.id)}"`, S.view==="artist"&&S.artistId===a.id, a.pic ? img(a.pic) : initial(a.name), esc(a.name), "Artiste", "", "rnd")).join("");
}

/* ---------- data ---------- */
async function loadTrending(g){
  if(loadTrending.busy?.[g]) return;
  (loadTrending.busy ||= {})[g] = true;
  try{
    const genre = g === "Tout" ? "" : "&genre="+encodeURIComponent(g);
    S.trending[g] = (await api(`/tracks/trending?time=week&limit=40${genre}`)).filter(t=>t.is_streamable!==false).map(norm);
  }catch(e){ S.trending[g] = null; }
  loadTrending.busy[g] = false;
  if(S.view === "home" && S.genre === g){ render(); enter(); }
}
async function loadArtist(id){
  if(loadArtist.busy?.[id]) return;
  (loadArtist.busy ||= {})[id] = true;
  try{
    const [u, tr] = await Promise.all([api(`/users/${id}`), api(`/users/${id}/tracks?sort=plays&limit=50`)]);
    S.artists[id] = { user: normUser(u), tracks: tr.filter(t=>t.is_streamable!==false).map(norm).sort((a,b)=>b.plays-a.plays) };
  }catch(e){ S.artists[id] = null; }
  loadArtist.busy[id] = false;
  if(S.view === "artist" && S.artistId === id){ render(); enter(); }
}
function toggleFollow(){
  const id = S.artistId, a = S.artists[id]; if(!a) return;
  if(isFollowing(id)){ S.following = S.following.filter(x => x.id !== id); toast("Tu ne suis plus "+a.user.name); }
  else { S.following.unshift({ id, name: a.user.name, pic: a.user.pic }); toast("Tu suis "+a.user.name); }
  store.set("following", S.following); render();
}
let searchTimer, searchId = 0;
async function doSearch(q){
  S.query = q.trim();
  const id = ++searchId;
  if(!S.query){ S.results = []; S.people = []; S.searching = false; return render(); }
  S.searching = true; paintSearch();
  try{
    const qs = encodeURIComponent(S.query);
    const [tr, us] = await Promise.all([api(`/tracks/search?query=${qs}&limit=40`), api(`/users/search?query=${qs}&limit=10`).catch(() => [])]);
    if(id !== searchId) return;
    S.results = tr.filter(t=>t.is_streamable!==false).map(norm);
    S.people = us.filter(u => u.track_count > 0).map(normUser);
  }catch(e){ if(id !== searchId) return; S.results = []; S.people = []; }
  S.searching = false; paintSearch(); enter();
}
function paintSearch(){
  visible = S.results;
  if(S.view !== "search") return;
  const box = $("#sres"); if(!box) return;
  // Repaint only the results so the input keeps focus
  box.innerHTML = searchBody();
  const browse = box.nextElementSibling;
  if(S.query && browse) browse.remove();
}

/* ---------- local files ---------- */
function addFiles(files){
  const list = [...files].filter(f => f.type.startsWith("audio/") || /\.(mp3|m4a|flac|wav|ogg|opus|aac)$/i.test(f.name));
  if(!list.length){ toast("Aucun fichier audio reconnu"); return; }
  list.forEach(f => {
    const url = URL.createObjectURL(f);
    const clean = f.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
    const parts = clean.split(" - ");
    const t = { key:"l:"+url, source:"local", title:(parts[1]||parts[0]).trim(), artist:parts[1]?parts[0].trim():"Fichier local", art:"", artBig:"", duration:0, src:url };
    const probe = new Audio(); probe.preload="metadata"; probe.src=url;
    probe.onloadedmetadata = () => { t.duration = probe.duration; if(S.view==="local") render(); };
    S.local.push(t);
  });
  toast(list.length+" fichier"+(list.length>1?"s ajoutés":" ajouté"));
  render();
}
function bindDrop(){
  const d = $("#drop"); if(!d) return;
  $("#files").onchange = e => addFiles(e.target.files);
  ["dragenter","dragover"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", e => addFiles(e.dataTransfer.files));
}

/* ---------- playback ---------- */
function contextLabel(){
  return { home: "Tendances" + (S.genre!=="Tout" ? " · "+S.genre : ""), search: "Recherche « "+S.query+" »", local: "Mes fichiers", likes: "Titres likés",
    playlist: (S.playlists.find(p=>p.id===S.plId)||{}).name || "Playlist",
    artist: S.artists[S.artistId]?.user.name || "Artiste" }[S.view] || "Pulse";
}
function buildOrder(start){
  const n = S.queue.length;
  S.order = [...Array(n).keys()];
  if(S.shuffle){
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; }
    if(start != null){ S.order.splice(S.order.indexOf(start),1); S.order.unshift(start); }
  }
  S.pos = start == null ? 0 : S.order.indexOf(start);
}
function playList(list, i, shuffled){
  if(!list.length) return;
  S.queue = list.slice(); S.ctx = contextLabel();
  if(shuffled){ S.shuffle = true; store.set("shuffle", true); buildOrder(null); }
  else buildOrder(i);
  loadCurrent(true);
}
function loadCurrent(autoplay){
  const t = S.queue[S.order[S.pos]];
  if(!t) return;
  if(!S.current){ const p = $("#player"); p.classList.add("first"); setTimeout(() => p.classList.remove("first"), 600); }
  S.current = t;
  audio.src = t.src;
  if(autoplay) audio.play().catch(()=>{});
  paintNow(); render(); renderQueue();
  $$(".now .txt, .np .info > div").forEach(e => retrigger(e, "swap"));
}
function paintNow(){
  const t = S.current;
  $$(".js-title").forEach(e => e.textContent = t ? t.title : "Rien en lecture");
  $$(".js-artist").forEach(e => {
    e.textContent = t ? t.artist : "Choisis un son pour commencer";
    if(t && t.artistId) e.dataset.artist = t.artistId; else delete e.dataset.artist;
  });
  $$(".js-art").forEach(e => e.innerHTML = t ? img(t.art,false) : "");
  $$(".js-bigart").forEach(e => e.innerHTML = t && t.artBig ? img(t.artBig,false) : ICON.note);
  $$(".js-artimg").forEach(e => { if(t && t.artBig) e.src = t.artBig; else e.removeAttribute("src"); });
  $$(".js-ctx").forEach(e => e.textContent = S.ctx || "Pulse");
  const bd = $("#backdrop");
  if(t && t.artBig){ $("#bdImg").src = t.artBig; bd.classList.add("on"); } else bd.classList.remove("on");
  document.title = t ? t.title + " · " + t.artist : "Pulse";
  if(t && "mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:"Pulse", artwork: t.artBig ? [{src:t.artBig,sizes:"1000x1000"}] : [] });
  }
  paintToggles();
}
function paintToggles(){
  document.body.classList.toggle("is-playing", !audio.paused && !!S.current);
  $$(".js-shuf").forEach(b => b.classList.toggle("on", S.shuffle));
  $$(".js-rep").forEach(b => { b.classList.toggle("on", S.repeat !== "off"); b.innerHTML = S.repeat === "one" ? ICON.rep1 : ICON.rep; b.title = {off:"Répéter : non", all:"Répéter la liste", one:"Répéter le titre"}[S.repeat]; });
  const liked = S.current && isLiked(S.current.key), can = S.current && S.current.source === "audius";
  $$(".js-like").forEach(b => { b.classList.toggle("liked", !!liked); b.hidden = !can; });
}
function step(dir, auto){
  if(!S.queue.length) return;
  if(dir < 0 && audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(auto && S.repeat === "one"){ audio.currentTime = 0; audio.play(); return; }
  let p = S.pos + dir;
  if(p >= S.queue.length){ if(S.repeat === "all" || !auto) p = 0; else { audio.pause(); audio.currentTime = 0; return; } }
  if(p < 0) p = S.queue.length - 1;
  S.pos = p; loadCurrent(true);
}
function toggle(){
  if(!S.current){ if(visible.length) playList(visible, 0); return; }
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}

function renderQueue(){
  const q = $("#queue"); if(q.hidden) return;
  const upcoming = S.order.slice(S.pos+1).map(i => S.queue[i]);
  const r = (t,i) => `<div class="row ${i<0?"cur":""}"><div class="main" ${i>=0?`data-qjump="${i}" tabindex="0" role="button"`:""}><div class="art">${img(t.art)}</div><div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div></div><div class="btns">${i>=0?`<button class="ib" data-qrm="${i}" aria-label="Retirer de la file">${ICON.x}</button>`:EQ}</div></div>`;
  q.innerHTML = `<div class="qh"><h3>File d'attente</h3><button class="ib" data-act="queue" aria-label="Fermer">${ICON.x}</button></div>
    <h4>En lecture</h4>${S.current ? r(S.current,-1) : `<div class="empty" style="padding:12px">Rien en lecture</div>`}
    <h4>À suivre${S.ctx?" · "+esc(S.ctx):""}</h4>${upcoming.length ? upcoming.slice(0,60).map((t,i)=>r(t,i)).join("") : `<div class="empty" style="padding:12px">La file est vide.</div>`}`;
}

/* ---------- likes & playlists ---------- */
function toggleLike(t){
  if(!t || t.source !== "audius") return;
  if(isLiked(t.key)){ S.likes = S.likes.filter(x=>x.key!==t.key); toast("Retiré des titres likés"); }
  else { S.likes.unshift(t); toast("Ajouté aux titres likés"); S.pop = t.key; }
  store.set("likes", S.likes); paintToggles(); render();
  if(S.pop){ if(isCur(t)) $$(".js-like").forEach(b => retrigger(b, "pop")); S.pop = null; }
}
const savePls = () => store.set("playlists", S.playlists);
function newPlaylist(name, first){
  const pl = { id:"p"+Date.now(), name: name.trim() || "Ma playlist n°"+(S.playlists.length+1), tracks: first ? [first] : [] };
  S.playlists.push(pl); savePls(); return pl;
}
function openModal(html){ const m=$("#modal"); m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; const i=m.querySelector("input"); if(i) setTimeout(()=>i.focus(),30); }
function closeModal(){ $("#modal").hidden = true; }
let pendingTrack = null;
function addToPlaylistDialog(t){
  pendingTrack = t;
  openModal(`<h3>Ajouter à une playlist</h3>
    <form class="newpl" id="plform"><input id="plname" placeholder="Nom d'une nouvelle playlist" maxlength="60"><button type="submit" class="btn primary">Créer</button></form>
    ${S.playlists.map(p=>`<button class="opt" data-addto="${p.id}"><span class="mini">${p.tracks[0]?.art?img(p.tracks[0].art):""}</span><span><b>${esc(p.name)}</b><small>${p.tracks.length} titres</small></span></button>`).join("")}
    <button class="btn soft" data-close style="justify-content:center">Annuler</button>`);
}
function newPlaylistDialog(){
  pendingTrack = null;
  openModal(`<h3>Nouvelle playlist</h3><form class="newpl" id="plform"><input id="plname" placeholder="Nom de la playlist" maxlength="60"><button type="submit" class="btn primary">Créer</button></form><button class="btn soft" data-close style="justify-content:center">Annuler</button>`);
}

/* ---------- events ---------- */
function go(view, arg, noHist){
  const same = view === S.view && (!arg || arg === (view === "artist" ? S.artistId : S.plId));
  if(!noHist && !same){ S.hist.push({ view: S.view, plId: S.plId, artistId: S.artistId }); if(S.hist.length > 30) S.hist.shift(); }
  S.view = view;
  if(arg && view === "playlist") S.plId = arg;
  if(arg && view === "artist") S.artistId = arg;
  closeNP(); $("#queue").hidden = true; render(); enter();
  const m = $("#main"); m.style.scrollBehavior = "auto"; m.scrollTop = 0; m.style.scrollBehavior = "";
  if(view === "search" && !S.query && !matchMedia("(max-width:760px)").matches) $("#q")?.focus();
}

const ACTS = {
  play: toggle, next: () => step(1), prev: () => step(-1),
  like: () => toggleLike(S.current),
  expand: () => { if(!S.current) return; $("#np").hidden = false; },
  collapse: closeNP,
  back: () => { const h = S.hist.pop(); if(!h) return go("home", null, true); S.plId = h.plId; S.artistId = h.artistId; go(h.view, null, true); },
  queue: () => { const q=$("#queue"); q.hidden = !q.hidden; renderQueue(); },
  mute: () => { audio.muted = !audio.muted; $("#muteBtn").style.color = audio.muted ? "var(--like)" : ""; toast(audio.muted ? "Son coupé" : "Son rétabli"); },
  shuf: () => {
    S.shuffle = !S.shuffle; store.set("shuffle", S.shuffle);
    if(S.queue.length) buildOrder(S.order[S.pos]);
    toast(S.shuffle ? "Lecture aléatoire activée" : "Lecture aléatoire désactivée");
    paintToggles(); renderQueue(); if(S.view !== "search") render();
  },
  rep: () => {
    S.repeat = {off:"all", all:"one", one:"off"}[S.repeat]; store.set("repeat", S.repeat);
    toast({off:"Répétition désactivée", all:"Répéter la liste", one:"Répéter le titre"}[S.repeat]);
    paintToggles();
  }
};

function handle(el){
  const d = el.dataset;
  if(d.artist){
    if(el.closest(".np-open") && matchMedia("(max-width:760px)").matches) return ACTS.expand();
    return go("artist", d.artist);
  }
  if(d.follow !== undefined){ toggleFollow(); const b = $("[data-follow]"); if(b) retrigger(b, "pop"); return; }
  if(d.retryartist !== undefined){ delete S.artists[S.artistId]; return render(); }
  if(d.act) return ACTS[d.act]?.();
  if(d.view) return go(d.view);
  if(d.go) return go(d.go);
  if(d.openpl) return go("playlist", d.openpl);
  if(d.genre){ S.genre = d.genre; render(); return enter(); }
  if(d.browse){ S.genre = d.browse; return go("home"); }
  if(d.retry !== undefined){ delete S.trending[S.genre]; return render(); }
  if(d.play !== undefined){
    const t = visible[+d.play];
    if(isCur(t)) return toggle();
    return playList(visible, +d.play);
  }
  if(d.playall !== undefined){
    if(S.current && S.queue.length && S.ctx === contextLabel()) return toggle();
    S.shuffle = false; store.set("shuffle", false); return playList(visible, 0);
  }
  if(d.shuffleall !== undefined) return playList(visible, 0, true);
  if(d.like !== undefined) return toggleLike(visible[+d.like]);
  if(d.add !== undefined) return addToPlaylistDialog(visible[+d.add]);
  if(d.rm !== undefined){
    const i = +d.rm;
    if(S.view === "local") S.local.splice(i,1);
    else { const pl = S.playlists.find(p=>p.id===S.plId); pl.tracks.splice(i,1); savePls(); toast("Retiré de la playlist"); }
    return render();
  }
  if(d.delpl !== undefined){
    const pl = S.playlists.find(p=>p.id===S.plId);
    return openModal(`<h3>Supprimer « ${esc(pl.name)} » ?</h3><p style="margin:0;color:var(--muted)">La playlist sera effacée. Les sons restent disponibles sur Audius.</p><div class="actions"><button class="btn primary" data-confirmdel style="background:var(--like);color:#fff">Supprimer</button><button class="btn soft" data-close>Annuler</button></div>`);
  }
  if(d.confirmdel !== undefined){ S.playlists = S.playlists.filter(p=>p.id!==S.plId); savePls(); closeModal(); toast("Playlist supprimée"); return go("home"); }
  if(d.addto){
    const pl = S.playlists.find(p=>p.id===d.addto);
    if(pl.tracks.some(t=>t.key===pendingTrack.key)) toast("Déjà dans « "+pl.name+" »");
    else { pl.tracks.push(pendingTrack); savePls(); toast("Ajouté à « "+pl.name+" »"); }
    closeModal(); return render();
  }
  if(d.newpl !== undefined || el.id === "newPl") return newPlaylistDialog();
  if(d.close !== undefined) return closeModal();
  if(d.qjump !== undefined){ S.pos = S.pos + 1 + (+d.qjump); return loadCurrent(true); }
  if(d.qrm !== undefined){ S.order.splice(S.pos + 1 + (+d.qrm), 1); return renderQueue(); }
}
const SEL = "button,[data-play],[data-go],[data-openpl],[data-qjump],[data-artist]";
document.addEventListener("click", e => {
  if(e.target.closest("label.drop")) return;
  const el = e.target.closest(SEL); if(el) handle(el);
});
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]:not(button)')){ e.preventDefault(); handle(e.target); return; }
  if(e.target.matches("input,textarea")) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  if(e.code === "ArrowRight" && e.shiftKey) step(1);
  if(e.code === "ArrowLeft" && e.shiftKey) step(-1);
  if(e.key === "Escape"){ closeModal(); $("#queue").hidden = true; closeNP(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "plform"){
    const t = pendingTrack, pl = newPlaylist($("#plname").value, t);
    toast(t ? "Ajouté à « "+pl.name+" »" : "Playlist « "+pl.name+" » créée");
    closeModal(); t ? render() : go("playlist", pl.id);
  }
  if(e.target.id === "sform"){ clearTimeout(searchTimer); $("#q").blur(); doSearch($("#q").value); }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ clearTimeout(searchTimer); const v = e.target.value; searchTimer = setTimeout(() => doSearch(v), 350); }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });

/* seek & volume */
let seeking = false;
$$(".js-seek").forEach(s => {
  s.addEventListener("input", () => { seeking = true; paintProgress(s.value/1000*(audio.duration||0)); });
  s.addEventListener("change", () => { if(audio.duration) audio.currentTime = s.value/1000*audio.duration; seeking = false; });
});
function paintProgress(time){
  const p = audio.duration ? time/audio.duration*1000 : 0;
  $$(".js-seek").forEach(s => { if(!seeking || document.activeElement !== s) s.value = p; s.style.setProperty("--p", p/10+"%"); });
  $$(".js-cur").forEach(e => e.textContent = fmt(time));
  $("#mprog").style.setProperty("--p", p/10+"%");
}
const vol = $("#vol");
vol.addEventListener("input", () => { audio.volume = vol.value/100; vol.style.setProperty("--p", vol.value+"%"); store.set("vol", +vol.value); });
vol.value = store.get("vol", 80); audio.volume = vol.value/100; vol.style.setProperty("--p", vol.value+"%");

audio.addEventListener("timeupdate", () => { if(!seeking) paintProgress(audio.currentTime); });
audio.addEventListener("loadedmetadata", () => { $$(".js-dur").forEach(e => e.textContent = fmt(audio.duration)); if(S.current && !S.current.duration) S.current.duration = audio.duration; });
const onPlayState = () => { paintToggles(); if(S.view === "home") $$(".card.cur .fab, .hero .btn.primary").length && render(); };
audio.addEventListener("play", onPlayState);
audio.addEventListener("pause", onPlayState);
audio.addEventListener("ended", () => step(1, true));
audio.addEventListener("error", () => { if(S.current && audio.src){ toast("Ce son ne peut pas être lu, passage au suivant"); setTimeout(() => step(1, true), 900); } });

if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
}

/* swipe down to close the now-playing screen */
(() => {
  const np = $("#np"); let y0 = null;
  np.addEventListener("touchstart", e => { if(e.target.closest("input")) return; y0 = e.touches[0].clientY; }, {passive:true});
  np.addEventListener("touchend", e => { if(y0 != null && e.changedTouches[0].clientY - y0 > 90) closeNP(); y0 = null; });
})();

paintNow();
render();
enter();
</script>
</body>
</html>
